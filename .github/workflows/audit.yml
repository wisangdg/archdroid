name: Audit

# Advisories are published between pushes. Audit main every week as well, so a
# new one turns main red instead of the next unrelated pull request (R23 in
# IMPROVEMENT-PLAN.md). CI runs the same audits on every push and PR.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: npm dependency audit
        run: npm audit --omit=dev --package-lock-only

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run test:e2e
          npm run build
          npm audit --omit=dev

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features dev-commands -- -D warnings
          cargo test
          cargo test --features dev-commands

      # Prebuilt binary: `cargo install` compiled cargo-audit on every run.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

      - name: Bundle build check
        run: |
          npm run build:bundles -- --bundles deb

      # The release binary itself, in WebKitGTK: starts, answers IPC, and
      # enforces the production CSP (test:e2e above uses Chromium and a fake
      # IPC layer). Without Waydroid it shows the setup screen.
      - name: Real binary smoke
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          export TAURI_WEBVIEW_AUTOMATION=true
          xvfb-run -a bash -c '
            WebKitWebDriver --port=4444 &
            driver=$!
            trap "kill $driver" EXIT
            python3 scripts/e2e/real-binary-smoke.py src-tauri/target/release/archdroid
          '


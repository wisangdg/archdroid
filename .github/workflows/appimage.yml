name: AppImage

# Release packages are built here, on the oldest supported base. An AppImage
# bundles its libraries: built on Arch (0.1.3) it required glibc 2.44 and did
# not start on Debian 12 or Ubuntu 24.04. The .deb and .rpm come from the same
# Ubuntu 22.04 build, and the Arch package repackages that .deb in an Arch
# container, so every artifact has the same binary and a recorded commit. The
# maintainer downloads the artifacts of the tagged commit, verifies them, and
# signs SHA256SUMS locally (docs/RELEASE-AND-UPDATES.md); no key is in CI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build AppImage, .deb and .rpm
        run: |
          npm ci
          npm run build:bundles -- --bundles appimage,deb,rpm

      - name: Drop bundled libwayland (host Mesa EGL needs the host's)
        run: scripts/release/repack-appimage.sh

      - name: glibc floor (2.35, Ubuntu 22.04)
        run: scripts/release/check-glibc.sh src-tauri/target/release/bundle/appimage/ArchDroid_*.AppImage 2.35

      - name: glibc floor of the packaged binary (2.35)
        run: |
          dir="$(mktemp -d)"
          cp src-tauri/target/release/archdroid "$dir/"
          scripts/release/check-glibc.sh "$dir" 2.35

      - name: Record provenance
        run: |
          cd src-tauri/target/release/bundle
          (cd appimage && sha256sum ArchDroid_*.AppImage | tee SHA256SUMS.appimage)
          sha256sum deb/ArchDroid_*.deb rpm/ArchDroid-*.rpm | tee SHA256SUMS.ci
          echo "commit $GITHUB_SHA, run $GITHUB_RUN_ID, $(lsb_release -ds), $(getconf GNU_LIBC_VERSION)" > BUILD-INFO.txt
          cp BUILD-INFO.txt appimage/BUILD-INFO.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/ArchDroid_*.AppImage
            src-tauri/target/release/bundle/appimage/SHA256SUMS.appimage
            src-tauri/target/release/bundle/appimage/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/ArchDroid_*.deb
            src-tauri/target/release/bundle/rpm/ArchDroid-*.rpm
            src-tauri/target/release/bundle/SHA256SUMS.ci
            src-tauri/target/release/bundle/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 90

  arch:
    # makepkg repackages the Ubuntu 22.04 .deb from the job above, so the Arch
    # package carries the same binary as the other artifacts.
    needs: appimage
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ github.sha }}
          path: src-tauri/target/release/bundle

      - name: Build the Arch package
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --nodeps"
          cd packaging/arch
          sha256sum archdroid-bin-[0-9]*.pkg.tar.zst | tee SHA256SUMS.arch

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-${{ github.sha }}
          path: |
            packaging/arch/archdroid-bin-[0-9]*.pkg.tar.zst
            packaging/arch/SHA256SUMS.arch
          if-no-files-found: error
          retention-days: 90

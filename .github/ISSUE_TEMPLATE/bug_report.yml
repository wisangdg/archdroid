name: Bug report
description: Something in ArchDroid does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ArchDroid has no telemetry, so this report is all we know about your system.
        Security problems: do not file them here, see the security policy.
  - type: input
    id: version
    attributes:
      label: ArchDroid version
      description: Shown next to the name in the top bar, or `archdroid --version`.
      placeholder: "0.1.5"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: How did you install it?
      options:
        - Arch package (.pkg.tar.zst)
        - .deb
        - .rpm
        - AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Arch Linux, Ubuntu 24.04, Fedora 44, ..."
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop / compositor and GPU
      placeholder: "Hyprland 0.56, Intel + NVIDIA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, and the exact message ArchDroid showed.
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic Bundle
      description: |
        Settings → Diagnostic Bundle → Create Bundle writes `~/Downloads/archdroid-diagnostics-<time>.txt`.
        Read it first: it can contain Android package and APK file names. Attach the file or paste it here.
      render: text
    validations:
      required: true

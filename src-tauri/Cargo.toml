[package]
name = "archdroid"
version = "0.1.10"
description = "Android emulator manager (Waydroid) for Linux"
authors = ["Wisang Drillian Geni <gwisang45@gmail.com>"]
license = "MIT"
repository = "https://github.com/wisangdg/archdroid"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "archdroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Commands that have no UI yet. Off by default: a production build must not
# expose arbitrary Android shell or root-writing IPC. Enable them while
# building the UI that will call them: `cargo run --features dev-commands`.
dev-commands = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.2"
dirs = "6.0.0"
tauri-plugin-dialog = "2.8.4"
base64 = "0.22.1"
evdev = "0.13.2"
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Smaller release binary. No `panic = "abort"`: `off_main_thread` turns a
# panicking command into an error result, which needs unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

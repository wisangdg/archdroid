[package]
name = "archdroid"
version = "0.1.2"
description = "Android emulator manager (Waydroid) for Linux"
authors = ["Wisang Drillian Geni <gwisang45@gmail.com>"]
license = "MIT"
repository = "https://github.com/wisangdg/archdroid"
homepage = "https://github.com/wisangdg/archdroid"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "archdroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Commands that have no UI yet. Off by default: a production build must not
# expose arbitrary Android shell or root-writing IPC. Enable them while
# building the UI that will call them: `cargo run --features dev-commands`.
dev-commands = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
base64 = "0.22.1"

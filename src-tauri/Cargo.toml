[package]
name = "droiddeck"
version = "0.1.0"
description = "Android emulator manager (Waydroid) for Linux"
authors = ["Wisang Drillian Geni <gwisang45@gmail.com>"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "droiddeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
base64 = "0.22.1"
